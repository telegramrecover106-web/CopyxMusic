name: Extract COPYxMUSIC ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Find ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "No ZIP file found in repository root."
            exit 1
          fi

          echo "ZIP found: $ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract ZIP
        run: |
          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

      - name: Copy project files to repository root
        run: |
          shopt -s dotglob
          cp -r extracted/* .
          rm -rf extracted
          rm -f "$ZIP"

      - name: Remove temporary files
        run: |
          find . -type d -name "__pycache__" -prune -exec rm -rf {} +
          find . -type f -name "*.pyc" -delete
          rm -f *.zip

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git diff --cached --quiet || git commit -m "Extract COPYxMUSIC project"
          git push
